name: Collect Analytics Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN can't push to master (branch protection requires
          # the test-gate.yml status check, which only PRs can satisfy). This bot
          # only ever touches data/** — no code for test-gate.yml to check — so it
          # bypasses the gate entirely by pushing as an admin via a personal PAT.
          # See docs/ADR.md ADR-016.
          token: ${{ secrets.GH_BOT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run analytics collection
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLARITY_API_KEY: ${{ secrets.CLARITY_API_KEY }}
        run: npx tsx scripts/collect-analytics.ts

      - name: Check GSC indexing status
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/check-indexing-status.ts

      - name: Process analytics data
        run: npx tsx scripts/process-analytics.ts

      - name: Manage data retention
        run: npx tsx scripts/manage-data-retention.ts

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/indexing-status.json
          if git diff --quiet --staged; then
            echo "No new data files to commit. Skipping commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore(collect-data): daily analytics collection, processing & retention ${DATE}"
            git push
          fi
