name: Weekly Report

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See docs/ADR.md ADR-016 — this bot only touches data/**, so it
          # bypasses the master branch protection gate via a personal PAT
          # rather than the default GITHUB_TOKEN (which can't push to a
          # protected branch and can't trigger test-gate.yml even via PR).
          token: ${{ secrets.GH_BOT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect Lighthouse scores
        run: npx tsx scripts/collect-lighthouse.ts

      - name: Run report generation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-report.ts

      - name: Run strategy review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-strategy-review.ts

      - name: Run title experiment
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/run-title-experiment.ts
        continue-on-error: true

      - name: Generate weekly specs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-weekly-specs.ts
        continue-on-error: true

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/post-slack-report.ts

      - name: Commit report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/reports data/history.md data/processed/trend.json data/action-log.json data/processed/lighthouse-*.json data/proposals.json data/processed/top-pages-history.json data/processed/unmatched-query-history.json; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --quiet --staged; then
            echo "No new report data to commit. Skipping commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore(weekly-report): generate weekly report ${DATE}"

            # master may have moved (e.g. a PR merging, or collect-data.yml
            # committing concurrently) between checkout and this push — retry
            # with a rebase onto the latest master instead of failing outright.
            attempt=0
            until git push; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "git push failed after 3 attempts — giving up."
                exit 1
              fi
              echo "git push rejected (attempt ${attempt}/3) — fetching and rebasing onto origin/master before retry..."
              git fetch origin master
              git rebase origin/master
            done
          fi
